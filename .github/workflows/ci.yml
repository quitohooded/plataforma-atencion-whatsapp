name: CI

# Se ejecuta a mano (pestaña Actions, «Run workflow»). En un repositorio privado los minutos de
# GitHub Actions dependen de la facturación de la cuenta y el proyecto no usa servicios pagos:
# las mismas verificaciones se corren localmente con `python scripts/verificar.py` antes de cada
# push (ver CONTRIBUTING.md). Si el repositorio pasa a ser público, Actions es gratuito y se
# pueden volver a activar los disparadores `push` y `pull_request`.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analisis:
    name: Análisis estático
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: Reglas (ruff check)
        run: ruff check --output-format=github .
      - name: Formato (ruff format)
        run: ruff format --check .

  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas con cobertura
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=85
        env:
          TZ: America/Argentina/Cordoba

  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Vulnerabilidades conocidas (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off
